version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: biokey-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: biokey_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: biokey-backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://admin:password@mongodb:27017
      DATABASE_NAME: biokey_db
      SECRET_KEY: your-secret-key-here
      AUTH_THRESHOLD: 0.7
    depends_on:
      - mongodb

volumes:
  mongodb_data: